# EEG分类与向量数据库配置

# 数据参数
data_path: "./dataset/2a"
subject: 4
dataset: "BCI2a"
loso: false
no_standard: false
fre_filter: true
augment: true
augment_factor: 10

# 模型参数
model: "Interpretable_mamba"
mamba_dim: 32
n_mamba_layers: 8  # 新增：Mamba层数
mamba_dropout: 0.1  # 新增：Mamba层间Dropout
dropout: 0.4
n_attention_heads: 32
init_type: "kaiming"

# 训练参数
batch_size: 32
epochs: 3000
lr: 0.0009
weight_decay: 0.01
patience: 500
mixup: true
mixup_alpha: 0.4
grad_clip: 0.5
label_smoothing: 0.1
optimizer: "adamw"
scheduler: "cosine"

# 向量数据库参数
enable_vector_db: true
db_type: "faiss"  # faiss, annoy, simple
feature_dim: 128
retrieval_topk: 10
build_db_on_train: true
use_db_for_few_shot: true

# 保存与日志
save_dir: "./results"
save_model: true
plot_cm: true
plot_curves: true
plot_retrieval: false
verbose: 1
